# Supabase local development config (supabase start)
project_id = "crafted-mfg"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true

# Phase 2 — schedule the carrier polling function (also configurable via
# the dashboard with pg_cron + pg_net once deployed):
# [functions.track-shipments]
# verify_jwt = false

[functions.qbo-oauth]
# The OAuth callback arrives from Intuit's servers without a Supabase JWT.
verify_jwt = false

[functions.qbo-sync]
verify_jwt = true
